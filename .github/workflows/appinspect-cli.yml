on:
  workflow_call:  
    inputs:
      tags:
        required: true
        type: string
    secrets:
      token:
        required: true
jobs:
    convert-tags:
        name: Convert Included Tags to Matrix Format
        runs-on: ubuntu-latest
        outputs:
          matrix-tags: ${{ steps.convert.outputs.matrix-tags }}
        steps:
          - name: Convert Tags
            id: convert
            shell: bash
            run: |
              tags="${{ inputs.tags }}"
              matrix=$(echo "$tags" | jq -cR 'split(",")')
              echo "matrix-tags=$matrix" >> $GITHUB_OUTPUT

    appinspect:
      runs-on: ubuntu-latest
      needs: convert-tags
      strategy:
        fail-fast: false
        matrix:
          tags: ${{ fromJson(needs.convert-tags.outputs.matrix-tags) }}
      steps:
        - uses: actions/checkout@v6
        - uses: actions/download-artifact@v8
          with:
            name: dist
            path: dist/
        - name: scan
          # Forked action: upstream 2.17.0 (Python 3.13, AppInspect 4.3.1) built
          # from the fork's Dockerfile, because upstream's prebuilt image still
          # carries compare_checks.py's inline (?i) ticket-id regex. That raises
          # re.error on Python 3.11+, which makes the .appinspect.expect.yaml
          # waiver mechanism inert: a repo with a documented waiver fails anyway,
          # with a traceback that says nothing about the app. The fork's selftest
          # workflow proves the waiver path. See livehybrid/appinspect-cli-action.
          uses: livehybrid/appinspect-cli-action@v2.17.0-py313
          with:
            app_path: dist/
            included_tags: ${{ matrix.tags }}
            result_file: appinspect_result_${{ matrix.tags }}.json

        - name: Run Generate Markdown Action
          id: generate-markdown
          if: always()
          uses: livehybrid/generate-appinspect-markdown-action@main
          with:
            json_file: "appinspect_result_${{ matrix.tags }}.json"
            tag: "${{ matrix.tags }}"
            github_token: ${{ secrets.token }}
            include_not_applicable: False