on:
  workflow_call:
    secrets:
      splunkbase_username:
        required: true
      splunkbase_password:
        required: true

jobs:
  quality-appinspect-api:
    # Secrets follow github.actor privileges: dependabot-actor runs receive none,
    # so the Splunkbase auth below can only fail. CLI AppInspect still runs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Must come BEFORE download-artifact, so the artifact is not disturbed.
      #
      # Without a checkout the runner workspace holds only dist/, so the repo's
      # .appinspect_api.expect.yaml is never present and the action fails with
      # "File .appinspect_api.expect.yaml not found" the moment the API reports
      # any failure. That made the API-side waiver mechanism impossible for every
      # consumer of this workflow: a repo could waive a finding for the CLI legs
      # and still have this job go red on a file it had actually committed.
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Run AppInspect API
        uses: splunk/appinspect-api-action@v3.0
        with:
          username: "${{ secrets.splunkbase_username }}"
          password: "${{ secrets.splunkbase_password }}"
          app_path: dist
          included_tags: private_victoria
          excluded_tags: offensive

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AppInspect_response.html
          path: AppInspect_response.html
