name: Deploy to SCDE

# Reusable: installs the packaged app artifact onto the Splunk Cloud Developer
# Edition stack via ACS. Credentials come from 1Password at runtime — the only
# GitHub secret a consumer needs is OP_SERVICE_ACCOUNT_TOKEN.
#
# 1Password schema (vault `cicd`, login item `splunk-cloud-stack`):
#   website  = bare stack hostname, e.g. scde-abc123.splunkcloud.com
#   username = stack admin user
#   password = stack admin password
#   token    = OPTIONAL stack JWT created on the stack UI (Settings > Tokens).
#
# Auth notes (learned the hard way, 2026-08-17):
#   - The stack's own 8089 mgmt port is firewalled from GitHub runners.
#   - The apps install endpoint is Bearer-only (Basic auth → 401).
#   - On SCDE, JWTs minted via the ACS tokens endpoint pass control-plane calls
#     (login/status/vetting) but the INSTALL step fails on-stack with "Failed to
#     decrypt the token" (Splunk-side bug, reproduced on a fresh stack; same as
#     the scdeploy nightly blocker). A token minted ON the stack always
#     decrypts, so a `token` field on the item is preferred when present.
#   ACS stack name is derived by stripping .splunkcloud.com from the hostname.

on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact name holding the packaged app tarball(s)
        type: string
        default: dist
      vault:
        description: 1Password vault holding the stack item
        type: string
        default: cicd
      stack_item:
        description: 1Password login item with stack url/username/password
        type: string
        default: splunk-cloud-stack
    secrets:
      op_service_account_token:
        required: true

jobs:
  deploy-scde:
    # Dependabot actors get no secrets, so this job could only fail for them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: dist/

      - name: Install 1Password CLI
        run: |
          curl -sSfLo op.zip https://cache.agilebits.com/dist/1P/op2/pkg/v2.24.0/op_linux_amd64_v2.24.0.zip
          sudo unzip -od /usr/local/bin/ op.zip
          rm op.zip
          sudo chmod +x /usr/local/bin/op
          op --version

      - name: Load stack credentials from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op_service_account_token }}
        run: |
          item=$(op item get "${{ inputs.stack_item }}" --vault "${{ inputs.vault }}" --format json)
          user=$(echo "$item" | jq -r '[.fields[] | select(.id=="username" or .purpose=="USERNAME") | .value][0] // empty')
          pass=$(echo "$item" | jq -r '[.fields[] | select(.id=="password" or .purpose=="PASSWORD") | .value][0] // empty')
          # Website slot first; fall back to any field labelled like a url/hostname/stack.
          url=$(echo "$item"  | jq -r '.urls[0].href // empty')
          if [ -z "$url" ]; then
            url=$(echo "$item" | jq -r '[.fields[] | select((.label // .id // "") | test("^(url|website|hostname|stack(_?url)?)$"; "i")) | .value][0] // empty')
          fi
          # Normalise to a bare hostname whatever shape the item stores.
          url=${url#https://}; url=${url#http://}; url=${url%%/*}
          if [ -z "$user" ] || [ -z "$pass" ] || [ -z "$url" ]; then
            missing=""
            [ -z "$user" ] && missing="$missing username"
            [ -z "$pass" ] && missing="$missing password"
            [ -z "$url" ]  && missing="$missing website-url"
            echo "::error::1Password item '${{ inputs.stack_item }}' (vault '${{ inputs.vault }}') is missing:$missing"
            echo "Available field labels (values withheld):"
            echo "$item" | jq -r '.fields[] | "  - id=\(.id // "-") label=\(.label // "-") purpose=\(.purpose // "-") has_value=\(has("value"))"'
            echo "Website entries: $(echo "$item" | jq -r '.urls | length')"
            exit 1
          fi
          # Optional pre-made stack token (see header) — preferred when present.
          preset=$(echo "$item" | jq -r '[.fields[] | select((.label // .id // "") | ascii_downcase == "token") | .value][0] // empty')
          # op-loaded values are NOT auto-masked (unlike secrets.*) — mask before
          # persisting, or later steps print resolved env blocks in clear text.
          echo "::add-mask::$pass"
          {
            echo "SPLUNKCLOUD_STACK_URL=$url"
            echo "SPLUNKCLOUD_ADMIN_USER=$user"
            echo "SPLUNKCLOUD_ADMIN_PASSWORD=$pass"
            echo "ACS_STACK=${url%.splunkcloud.com}"
          } >> "$GITHUB_ENV"
          if [ -n "$preset" ]; then
            echo "::add-mask::$preset"
            echo "STACK_TOKEN_PRESET=$preset" >> "$GITHUB_ENV"
            echo "Using pre-made stack token from the 1Password item"
          fi

      - name: Install ACS CLI
        run: |
          ACS_VERSION="v2.23.0"
          curl -sSfLo /tmp/acs.tgz "https://github.com/splunk/acs-cli/releases/download/${ACS_VERSION}/acs_${ACS_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/acs.tgz -C /tmp
          sudo install -m 0755 "$(find /tmp -maxdepth 2 -name acs -type f | head -1)" /usr/local/bin/acs
          acs version || acs --version

      - name: Install app package(s) via ACS
        run: |
          mkdir -p acs-pkgs
          find dist -name '*.tar.gz' -exec cp {} acs-pkgs/ \;
          count=$(find acs-pkgs -name '*.tar.gz' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no .tar.gz found in artifact '${{ inputs.artifact }}'"
            exit 1
          fi
          if [ -n "${STACK_TOKEN_PRESET:-}" ]; then
            STACK_TOKEN="$STACK_TOKEN_PRESET"
          else
            # Mint a stack JWT via the ACS tokens endpoint (admin.splunk.com is
            # public). NOTE: on SCDE these tokens currently fail the install step
            # ("Failed to decrypt the token") — see header; prefer a UI token.
            TOK_RESP=$(curl -sS -u "${SPLUNKCLOUD_ADMIN_USER}:${SPLUNKCLOUD_ADMIN_PASSWORD}" \
              -X POST "https://admin.splunk.com/${ACS_STACK}/adminconfig/v2/tokens" \
              -H 'Content-Type: application/json' \
              -d "{\"user\":\"${SPLUNKCLOUD_ADMIN_USER}\",\"audience\":\"deploy-scde\",\"type\":\"static\",\"expiresOn\":\"+4h\"}")
            STACK_TOKEN=$(echo "$TOK_RESP" | jq -r '.token // empty')
            if [ -z "$STACK_TOKEN" ]; then
              echo "::error::could not mint a stack token via the ACS tokens endpoint"
              echo "$TOK_RESP" | jq 'del(.token)' 2>/dev/null || echo "$TOK_RESP"
              exit 1
            fi
          fi
          echo "::add-mask::${STACK_TOKEN}"
          export STACK_TOKEN
          acs config add-stack "$ACS_STACK" || echo "stack already configured"
          acs config use-stack "$ACS_STACK"
          # A freshly-provisioned stack can hold a valid token while ACS metadata
          # (stack type/status) is still coming up — retry login for up to 10 min.
          attempt=0
          until acs login --token-user "$SPLUNKCLOUD_ADMIN_USER"; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 10 ]; then
              echo "::error::acs login still failing after $attempt attempts"
              echo "---- ACS status probe ----"
              curl -sS -o /tmp/acs_status.json -w 'HTTP %{http_code}\n' \
                -H "Authorization: Bearer ${STACK_TOKEN}" \
                "https://admin.splunk.com/${ACS_STACK}/adminconfig/v2/status" || true
              head -c 2000 /tmp/acs_status.json 2>/dev/null; echo
              exit 1
            fi
            echo "acs login failed (attempt $attempt) — stack may still be provisioning; retrying in 60s"
            sleep 60
          done
          acs status current-stack
          # The vetting submit can 503 transiently — retry the install.
          tries=0
          until acs apps bulk-install private --package-src-dir acs-pkgs/ --acs-legal-ack=Y; do
            tries=$((tries+1))
            if [ "$tries" -ge 3 ]; then
              echo "::error::ACS app install failed after $tries attempts. If the error above is 'Failed to decrypt the token', that is the known SCDE issue with ACS-minted JWTs: create a token on the stack UI (Settings > Tokens) and store it as a 'token' field on the '${{ inputs.stack_item }}' item — this workflow uses it automatically."
              exit 1
            fi
            echo "install attempt $tries failed — retrying in 30s"
            sleep 30
          done
